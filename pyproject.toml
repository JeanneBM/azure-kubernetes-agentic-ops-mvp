[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-kubernetes-agentic-ops"
version = "0.2.0"
description = "Event-driven, safety-first incident orchestration for Kubernetes and AKS."
requires-python = ">=3.11"
# Ranges cover what the test suite was run against; constraints.txt pins the exact set used in the image.
dependencies = [
    "azure-identity>=1.17,<2",
    "fastapi>=0.115,<0.150",
    "httpx>=0.27,<0.29",
    "kubernetes>=30.1,<37",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-timeout>=2.3,<3",
    # Starlette >= 1.0 TestClient wants httpx2; without it it falls back to httpx with a deprecation warning.
    "httpx2>=2.13,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# A hang must fail with a stack dump instead of blocking the run forever.
timeout = 60
