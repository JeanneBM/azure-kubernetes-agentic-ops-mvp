# Demo workload with a deliberate typo in the image name: "paymnets-api" instead of "payments-api".
# The agent should detect ImagePullBackOff, verify the corrected image exists in ACR and patch the Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: ${MANAGED_NAMESPACE}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: api
          image: "${ACR_LOGIN_SERVER}/paymnets-api:1.4.2"
          ports:
            - containerPort: 80
